spring.application.name=luanvan-backend
spring.datasource.url=jdbc:mysql://localhost:3306/luanvan_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=9090

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT Configuration
jwt.secret=thisisasecretkeyforsigningjwtsluanvandaihocnttmien
jwt.expiration=86400000

# SMS Gateway Configuration (Mock for development)
sms.api.url=https://api-sms-gateway.example.com
sms.api.key=dev-api-key-for-testing

# Logging Configuration
logging.level.root=INFO
logging.level.com.luanvan.luanvanbackend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.jdbc.datasource.init=DEBUG

# Error Messages
error.phone.exists=Số điện thoại đã được đăng ký
error.email.exists=Email đã được đăng ký
error.password.mismatch=Mật khẩu và xác nhận mật khẩu không khớp
error.otp.invalid=Mã OTP không hợp lệ hoặc đã hết hạn
error.session.invalid=Phiên xác thực không hợp lệ
error.account.not-found=Không tìm thấy tài khoản
error.account.not-active=Tài khoản chưa được kích hoạt, vui lòng xác thực OTP