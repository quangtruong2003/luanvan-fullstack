# HikariCP Connection Pool Optimization
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# Timezone Configuration
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# JPA/Hibernate Configuration - Performance Optimized cho MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
# Transaction Configuration
spring.jpa.properties.hibernate.connection.autocommit=false
spring.jpa.open-in-view=false
spring.transaction.default-timeout=30
# Cache configuration tạm thời tắt để tránh lỗi
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.generate_statistics=false

# Flyway Migration Configuration - Tạm thời TẮT để giải quyết lỗi circular dependency
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Server Configuration - Production Optimized
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
server.http2.enabled=true

# Async Processing Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.pool.keep-alive=60s
spring.task.execution.thread-name-prefix=async-
spring.task.scheduling.pool.size=5

# Security Configuration
app.jwt.secret=${JWT_SECRET_V2:mySecretKey}
app.jwt.expiration=${JWT_EXPIRATION_V2:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_V2:604800000}

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=300s

# Application-specific Configuration
app.file.upload-dir=./uploads
app.payment.momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
app.payment.momo.partner-code=${MOMO_PARTNER_CODE_V2:your_partner_code}
app.payment.momo.access-key=${MOMO_ACCESS_KEY_V2:your_access_key}
app.payment.momo.secret-key=${MOMO_SECRET_KEY_V2:your_secret_key}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.max-age=3600

# Performance Monitoring
app.performance.slow-query-threshold=1000
app.performance.enable-query-logging=false
app.performance.enable-method-timing=true

# Circuit Breaker Configuration (if using Resilience4j)
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.default.sliding-window-size=20
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=30s

# Retry Configuration
resilience4j.retry.instances.default.max-attempts=3
resilience4j.retry.instances.default.wait-duration=1s

# Time Limit Configuration
resilience4j.timelimiter.instances.default.timeout-duration=5s