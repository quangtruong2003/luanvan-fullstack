<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Payment API</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 15px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test Payment API Endpoints</h1>
    
    <div class="test-section">
        <h2>1. Test Get System Config</h2>
        <button onclick="testGetConfig()">Get System Config</button>
        <div id="getConfigResult"></div>
    </div>

    <div class="test-section">
        <h2>2. Test Toggle MoMo</h2>
        <button onclick="testToggleMomo(true)">Enable MoMo</button>
        <button onclick="testToggleMomo(false)">Disable MoMo</button>
        <div id="toggleMomoResult"></div>
    </div>

    <div class="test-section">
        <h2>3. Test Toggle VNPay</h2>
        <button onclick="testToggleVNPay(true)">Enable VNPay</button>
        <button onclick="testToggleVNPay(false)">Disable VNPay</button>
        <div id="toggleVNPayResult"></div>
    </div>

    <div class="test-section">
        <h2>4. Test Update Full Config</h2>
        <button onclick="testUpdateConfig()">Update Config</button>
        <div id="updateConfigResult"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:9090/api';
        
        // Get token from localStorage (you need to login to admin first)
        function getAuthHeaders() {
            const token = localStorage.getItem('token');
            return {
                'Content-Type': 'application/json',
                ...(token && { 'Authorization': `Bearer ${token}` })
            };
        }

        async function testGetConfig() {
            const resultDiv = document.getElementById('getConfigResult');
            try {
                console.log('🔄 Testing GET /system-config');
                const response = await fetch(`${API_BASE_URL}/system-config`, {
                    method: 'GET',
                    headers: getAuthHeaders()
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `<div class="success"><h3>✅ Success</h3><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                    console.log('✅ Get config success:', data);
                } else {
                    const errorText = await response.text();
                    resultDiv.innerHTML = `<div class="error"><h3>❌ Error ${response.status}</h3><pre>${errorText}</pre></div>`;
                    console.error('❌ Get config error:', response.status, errorText);
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error"><h3>❌ Network Error</h3><pre>${error.message}</pre></div>`;
                console.error('❌ Network error:', error);
            }
        }

        async function testToggleMomo(enable) {
            const resultDiv = document.getElementById('toggleMomoResult');
            try {
                console.log(`🔄 Testing PUT /system-config/payment/momo/toggle?enableMomo=${enable}`);
                const response = await fetch(`${API_BASE_URL}/system-config/payment/momo/toggle?enableMomo=${enable}`, {
                    method: 'PUT',
                    headers: getAuthHeaders()
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `<div class="success"><h3>✅ MoMo ${enable ? 'Enabled' : 'Disabled'}</h3><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                    console.log(`✅ Toggle MoMo ${enable} success:`, data);
                } else {
                    const errorText = await response.text();
                    resultDiv.innerHTML = `<div class="error"><h3>❌ Error ${response.status}</h3><pre>${errorText}</pre></div>`;
                    console.error('❌ Toggle MoMo error:', response.status, errorText);
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error"><h3>❌ Network Error</h3><pre>${error.message}</pre></div>`;
                console.error('❌ Network error:', error);
            }
        }

        async function testToggleVNPay(enable) {
            const resultDiv = document.getElementById('toggleVNPayResult');
            try {
                console.log(`🔄 Testing PUT /system-config/payment/vnpay/toggle?enableVNPay=${enable}`);
                const response = await fetch(`${API_BASE_URL}/system-config/payment/vnpay/toggle?enableVNPay=${enable}`, {
                    method: 'PUT',
                    headers: getAuthHeaders()
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `<div class="success"><h3>✅ VNPay ${enable ? 'Enabled' : 'Disabled'}</h3><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                    console.log(`✅ Toggle VNPay ${enable} success:`, data);
                } else {
                    const errorText = await response.text();
                    resultDiv.innerHTML = `<div class="error"><h3>❌ Error ${response.status}</h3><pre>${errorText}</pre></div>`;
                    console.error('❌ Toggle VNPay error:', response.status, errorText);
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error"><h3>❌ Network Error</h3><pre>${error.message}</pre></div>`;
                console.error('❌ Network error:', error);
            }
        }

        async function testUpdateConfig() {
            const resultDiv = document.getElementById('updateConfigResult');
            try {
                const configData = {
                    enableMomo: true,
                    enableVNPay: true,
                    momoPartnerCode: 'TEST_PARTNER',
                    momoAccessKey: 'TEST_ACCESS_KEY',
                    momoSecretKey: 'TEST_SECRET_KEY',
                    vnpayTmnCode: 'TEST_TMN_CODE',
                    vnpaySecretKey: 'TEST_VNPAY_SECRET',
                    defaultPaymentMethod: 'momo',
                    defaultDepositAmount: 75000
                };
                
                console.log('🔄 Testing PUT /system-config with data:', configData);
                const response = await fetch(`${API_BASE_URL}/system-config`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(configData)
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `<div class="success"><h3>✅ Config Updated</h3><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                    console.log('✅ Update config success:', data);
                } else {
                    const errorText = await response.text();
                    resultDiv.innerHTML = `<div class="error"><h3>❌ Error ${response.status}</h3><pre>${errorText}</pre></div>`;
                    console.error('❌ Update config error:', response.status, errorText);
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error"><h3>❌ Network Error</h3><pre>${error.message}</pre></div>`;
                console.error('❌ Network error:', error);
            }
        }

        // Auto-load config on page load
        window.onload = function() {
            console.log('🎯 Payment API Test Page Loaded');
            console.log('💡 Make sure you are logged in as admin and backend is running on port 9090');
            testGetConfig();
        };
    </script>
</body>
</html>
