version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: luanvan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: luanvan_db
      MYSQL_USER: luanvan
      MYSQL_PASSWORD: luanvanpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./luanvan-backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    networks:
      - luanvan-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: ./luanvan-backend
    container_name: luanvan-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/luanvan_db?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: luanvan
      SPRING_DATASOURCE_PASSWORD: luanvanpassword
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-here-min-256-bits-long}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - luanvan-network
    restart: unless-stopped

  frontend:
    build: ./luanvan-frontend
    container_name: luanvan-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:8080
      VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "5173:5173"
    networks:
      - luanvan-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  luanvan-network:
    driver: bridge 